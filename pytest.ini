# 执行模式：push 跑 smoke；定时任务跑全量（见 .github/workflows/api-tests.yml）
# 注意：本文件必须是 UTF-8 无 BOM。用 PowerShell 的 Set-Content -Encoding utf8 会写入 BOM，
# pytest 解析首行会直接报 unexpected line 并退出（exit code 4）。
[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: 冒烟用例，每次提交都跑
    auth: 登录与鉴权
    user: 用户与地址
    product: 商品与搜索
    cart: 购物车
    order: 订单与结算
    payment: 支付与回调
    negative: 异常路径
    db: 包含数据库状态校验
filterwarnings =
    ignore::DeprecationWarning
