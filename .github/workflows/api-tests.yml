name: api-tests

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00；cron 只认 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest -m 表达式（smoke / not slow / 空=全量）"
        default: "smoke"
        required: false
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "framework/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/api-tests.yml"

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # 自托管 Runner：跑在部署了 Spree 的那台机器上，才能访问 localhost:3000 和本地数据库
    runs-on: self-hosted
    timeout-minutes: 30
    # Windows Runner 默认用 PowerShell，这里统一走 bash（Git Bash）
    defaults:
      run:
        shell: bash
    # 发布报告到 gh-pages 需要写权限，否则 peaceiris 那步会 403
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Allure CLI
        run: npm install -g allure-commandline

      - name: 运行接口测试
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          DB_DSN: ${{ secrets.DB_DSN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MARKER="${{ github.event.inputs.marker || 'smoke' }}"
          if [ -z "$MARKER" ]; then
            pytest --alluredir=allure-results
          else
            pytest -m "$MARKER" --alluredir=allure-results
          fi

      - name: 生成 Allure 报告
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: 清理测试数据
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_DSN: ${{ secrets.DB_DSN }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/cleanup_test_data.py --yes

      - name: 上传报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: |
            allure-report
            allure-results
          retention-days: 30

      - name: 发布到 GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: true
