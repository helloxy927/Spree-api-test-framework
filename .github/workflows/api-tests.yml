# CI 依赖本机 Docker + Spree + 自托管 Runner，开机顺序见 README 7.1
# 自托管 Runner（Windows + Git Bash）
name: api-tests

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00；cron 只认 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest -m 表达式（smoke / not slow / 空=全量）"
        default: "smoke"
        required: false
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "framework/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/api-tests.yml"

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # 自托管 Runner：跑在部署了 Spree 的那台机器上，才能访问 localhost:3000 和本地数据库
    runs-on: self-hosted
    timeout-minutes: 30
    # Windows Runner 默认用 PowerShell，这里统一走 bash（Git Bash）
    defaults:
      run:
        shell: bash
    # 发布报告到 gh-pages 需要写权限，否则 peaceiris 那步会 403
    permissions:
      contents: write
    env:
      # Windows 默认 GBK，中文断言信息会炸，强制 UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 国内直连 PyPI / npm 官方源经常超时，走镜像（海外环境删掉这两行即可）
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

    steps:
      - uses: actions/checkout@v4

      # 不用 actions/setup-python：它要从 GitHub 下载 Python 发行包，本机直连会被墙。
      # 这台机器（也就是 SUT 所在机器）已经装了 Python 3.12 / Node 24，直接把目录写进 PATH，
      # 避免 runner 环境里 `python` 命中 Windows Store 的占位程序。
      - name: 配置运行环境
        run: |
          echo "D:/devSoftware/Python312" >> "$GITHUB_PATH"
          echo "D:/devSoftware/Python312/Scripts" >> "$GITHUB_PATH"
          echo "D:/devSoftware/nodejs" >> "$GITHUB_PATH"
          echo "PATH 已追加，下一步开始可用"

      - name: 检查运行环境
        run: |
          set -x
          which python
          python --version
          python -m pip --version
          node --version
          npm --version

      - name: 安装依赖
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 2>&1 | tee pip-install.log

      # 机器上已经有 allure 就不重复装：
      # 重复 npm install 会去替换正在被占用的 jar，报 EBUSY（本地开着 allure serve 时必现）
      - name: 安装 Allure CLI
        run: |
          set -o pipefail
          if command -v allure >/dev/null 2>&1; then
            echo "allure 已存在：$(allure --version)，跳过安装"
          else
            npm install -g allure-commandline 2>&1 | tee npm-install.log
          fi

      # 开机后 Docker/Spree 可能还在启动，先等接口真正可用，避免「环境类」假失败
      - name: 等待被测系统就绪
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-Spree-Api-Key: ${API_KEY}" \
              "${BASE_URL}/api/v3/store/products" || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "SUT 就绪（HTTP $code，等待 $((i*2)) 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "SUT 在 120 秒内未就绪，最后状态码: $code"
          exit 1

      - name: 运行接口测试
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          DB_DSN: ${{ secrets.DB_DSN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          EVENT="${{ github.event_name }}"
          INPUT="${{ github.event.inputs.marker }}"
          if [ "$EVENT" = "schedule" ]; then
            # 每天定时跑全量 60 条
            MARKER=""
          elif [ -n "$INPUT" ]; then
            MARKER="$INPUT"
          else
            # push 只跑冒烟，快速反馈
            MARKER="smoke"
          fi

          echo "event=$EVENT marker=${MARKER:-<全量>}"
          if [ -z "$MARKER" ]; then
            python -m pytest --alluredir=allure-results --clean-alluredir
          else
            python -m pytest -m "$MARKER" --alluredir=allure-results --clean-alluredir
          fi

      - name: 生成 Allure 报告
        if: always()
        continue-on-error: true
        run: allure generate allure-results -o allure-report --clean

      - name: 清理测试数据
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_DSN: ${{ secrets.DB_DSN }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/cleanup_test_data.py --yes

      - name: 上传报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: |
            allure-report
            allure-results
          retention-days: 30

      # Pages 还没启用时这步会失败，不影响测试结论，先允许它红
      - name: 发布到 GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: true
