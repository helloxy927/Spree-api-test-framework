# 自托管执行：Runner 跑在部署了 Spree 的本机上，可直连 localhost
name: api-tests

on:
  schedule:
    # UTC 18:00 = 鍖椾含鏃堕棿娆℃棩 02:00锛沜ron 鍙 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest -m 琛ㄨ揪寮忥紙smoke / not slow / 绌?鍏ㄩ噺锛?
        default: "smoke"
        required: false
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "framework/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/api-tests.yml"

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # 鑷墭绠?Runner锛氳窇鍦ㄩ儴缃蹭簡 Spree 鐨勯偅鍙版満鍣ㄤ笂锛屾墠鑳借闂?localhost:3000 鍜屾湰鍦版暟鎹簱
    runs-on: self-hosted
    timeout-minutes: 30
    # Windows Runner 榛樿鐢?PowerShell锛岃繖閲岀粺涓€璧?bash锛圙it Bash锛?
    defaults:
      run:
        shell: bash
    # 鍙戝竷鎶ュ憡鍒?gh-pages 闇€瑕佸啓鏉冮檺锛屽惁鍒?peaceiris 閭ｆ浼?403
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 瀹夎渚濊禆
        run: pip install -r requirements.txt

      - name: 瀹夎 Allure CLI
        run: npm install -g allure-commandline

      - name: 杩愯鎺ュ彛娴嬭瘯
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          DB_DSN: ${{ secrets.DB_DSN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MARKER="${{ github.event.inputs.marker || 'smoke' }}"
          if [ -z "$MARKER" ]; then
            pytest --alluredir=allure-results
          else
            pytest -m "$MARKER" --alluredir=allure-results
          fi

      - name: 鐢熸垚 Allure 鎶ュ憡
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: 娓呯悊娴嬭瘯鏁版嵁
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_DSN: ${{ secrets.DB_DSN }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/cleanup_test_data.py --yes

      - name: 涓婁紶鎶ュ憡涓庢棩蹇?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: |
            allure-report
            allure-results
          retention-days: 30

      - name: 鍙戝竷鍒?GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: true

